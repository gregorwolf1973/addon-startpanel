    branches: [master]
    paths: ["startpanel/**"]
  workflow_dispatch:
jobs:
  startpanel:
    permissions: {contents: read, packages: write}
    uses: gregorwolf1973/ha-addons/.github/workflows/build-addon.yaml@main
    with:
      addon: "startpanel"
      image: "ghcr.io/gregorwolf1973/{arch}-addon-startpanel"
